<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Exam</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .option-btn {
            width: 100%;
            text-align: left;
            margin-bottom: 10px;
        }
    </style>
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- Timer -->
    <div class="alert alert-info text-center">
        Time Left: <span id="timer">00:00</span>
    </div>

    <!-- Question -->
    <div class="card shadow-sm">

        <div class="card-body">

            <h5>
                {{ question.question_text }}
            </h5>

            <form method="POST">

                <input type="hidden" name="question_id" value="{{ question.id }}">

                <button name="answer" value="A" class="btn btn-outline-primary option-btn">
                    A. {{ question.choice_a }}
                </button>

                <button name="answer" value="B" class="btn btn-outline-primary option-btn">
                    B. {{ question.choice_b }}
                </button>

                <button name="answer" value="C" class="btn btn-outline-primary option-btn">
                    C. {{ question.choice_c }}
                </button>

                <button name="answer" value="D" class="btn btn-outline-primary option-btn">
                    D. {{ question.choice_d }}
                </button>

            </form>

        </div>

    </div>

</div>

<script>
let timeLeft = {{ time_left or 0 }};

function updateTimer() {
    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    document.getElementById("timer").innerText =
        `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

    if(timeLeft <= 0){
        alert("Time is up!");
        document.forms[0].submit();
    }

    timeLeft--;
}

setInterval(updateTimer, 1000);
</script>

</body>
</html>
