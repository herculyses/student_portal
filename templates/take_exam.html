<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Exam</title>

<link rel="icon" type="image/png"
      href="{{ url_for('static', filename='favicon.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .option-btn {
            width: 100%;
            text-align: left;
            margin-bottom: 10px;
        }
        .fade-out{

            opacity:0;

            transform:translateX(-20px);

            transition:all .001s ease;

        }
        .current-question {

            border: 3px solid #0d6efd !important;

            box-shadow: 0 0 12px rgba(13,110,253,.35);

            transform: scale(1.08);

        }

        #questionNavigator {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
        }

        #questionNavigator button {
            padding: 4px 0;
            font-size: 12px;
        }

        .nav-pulse {
            animation: pulse 0.35s ease;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.12);
                box-shadow: 0 0 10px rgba(13,110,253,0.4);
            }
            100% {
                transform: scale(1);
            }
        }

        /* ==========================================
           Save Status Toast
        ========================================== */

        #saveStatus{

            opacity:0;

            transition:opacity .25s ease;

        }

        #saveStatus.show{

            opacity:1;

        }

        /* ==========================================
           Question Card Animation
        ========================================== */

        #questionCard{

            transition:
                opacity .25s ease,
                transform .25s ease;

        }

#questionCard.fade-out{

    opacity:0;

    transform:translateX(-40px);

}
    </style>
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- Timer -->
    <div class="alert alert-info text-center">
        Time Left:
        <span id="timer"></span>

        <input
            type="hidden"
            id="remainingSeconds"
            value="{{ remaining_seconds }}"
        >
    </div>

    <!-- Question -->
    <div id="questionCard" class="card shadow-sm">
        <div class="card-body">

            <h5>
                {{ question.question_text }}
            </h5>

            <div id="saveStatus"
                 class="text-success small fw-bold">

                ✓ Answer Saved

            </div>

<form method="POST" action="{{ url_for('submit_answer', exam_id=exam.id) }}">

    <input type="hidden"
           id="questionId"
           value="{{ question.id }}">
    <input type="hidden"
           name="answer"
           id="selectedAnswer"
           value="{{ saved_answer.selected_answer if saved_answer else '' }}">

    <button type="button"
            class="btn btn-outline-primary option-btn"
            data-answer="A"
            onclick="Exam.answers.select('A', this)">
        A. {{ question.choice_a }}
    </button>

    <button type="button"
            class="btn btn-outline-primary option-btn"
            data-answer="B"
            onclick="Exam.answers.select('B', this)">
        B. {{ question.choice_b }}
    </button>

    <button type="button"
            class="btn btn-outline-primary option-btn"
            data-answer="C"
            onclick="Exam.answers.select('C', this)">
        C. {{ question.choice_c }}
    </button>

    <button type="button"
            class="btn btn-outline-primary option-btn"
            data-answer="D"
            onclick="Exam.answers.select('D', this)">
        D. {{ question.choice_d }}
    </button>

</form>

        </div>

    </div>

</div>

<div class="d-flex justify-content-between mt-4">

    {% if prev_question %}
    <button
        class="btn btn-secondary"
        onclick="Exam.navigation.go('{{ url_for('take_exam',
            exam_id=exam.id,
            question_id=prev_question.id) }}')">

        ⬅ Previous

    </button>
    {% else %}
    <div></div>
    {% endif %}

    {% if next_question %}
    <button
        class="btn btn-primary"
        onclick="Exam.navigation.go('{{ url_for('take_exam',
            exam_id=exam.id,
            question_id=next_question.id) }}')">

        Next ➡

    </button>
    {% else %}
    <button
        class="btn btn-info"
        onclick="Exam.review.open()">

        📋 Review Answers

    </button>
    <button
        class="btn btn-success"
        onclick="Exam.submit.finish()">

        Finish Exam

    </button>
    {% endif %}

</div>

<div class="fixed-bottom bg-light p-2 border-top">

  <div class="container">

    <!-- ========================================================= -->
    <!-- 🧭 QUESTION NAVIGATOR -->
    <!-- Displays all questions and their answer status -->
    <!-- ========================================================= -->

    <div class="card mb-3">

        <div class="card-header fw-bold">

            🧭 Question Navigator

        </div>

        <div class="card-body">

            <div id="questionNavigator">

                Loading navigator...

            </div>

        </div>

    </div>

    <div class="d-flex justify-content-between mb-1">
      <small>Progress</small>
      <small>{{ current_index }} / {{ total }}</small>
    </div>

    <div id="examSummary" class="mb-2 small fw-bold text-muted"></div>

    <div class="progress">
      <div class="progress-bar"
           role="progressbar"
           style="width: {{ progress }}%">
        {{ progress }}%
      </div>
    </div>

  </div>

</div>

<!-- ========================================================= -->
<!-- 📋 REVIEW ANSWERS MODAL -->
<!-- Shows only the student's answers. -->
<!-- No question text or correct answers are displayed. -->
<!-- ========================================================= -->

<div class="modal fade"
     id="reviewModal"
     tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    Review Answers

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div id="reviewContent">

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Close

                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const submitExamURL =
    "{{ url_for('submit_exam', exam_id=exam.id) }}";
const reviewAnswersURL =
    "{{ url_for('review_answers', exam_id=exam.id) }}";
const currentQuestionId = {{ question.id }};
</script>

<script src="{{ url_for('static', filename='js/exam-engine.js') }}"></script>

</body>
</html>
