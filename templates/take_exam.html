<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Exam</title>

<link rel="icon" type="image/png"
      href="{{ url_for('static', filename='favicon.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .option-btn {
            width: 100%;
            text-align: left;
            margin-bottom: 10px;
        }

        /* ==========================================
           Question Card Animation
        ========================================== */

        #questionCard{

            transition:
                opacity .25s ease,
                transform .25s ease;

        }

#questionCard.fade-out{

    opacity:0;

    transform:translateX(-40px);

}
    </style>
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- Timer -->
    <div class="alert alert-info text-center">
        Time Left:
        <span id="timer"></span>

        <input
            type="hidden"
            id="remainingSeconds"
            value="{{ remaining_seconds }}"
        >
    </div>

    <!-- Question -->
    <div id="questionCard" class="card shadow-sm">
        <div class="card-body">

            <h5>
                {{ question.question_text }}
            </h5>

            <div id="saveStatus"
                 class="text-success small fw-bold"
                 style="display:none;">

                ✓ Answer Saved

            </div>

<form method="POST" action="{{ url_for('submit_answer', exam_id=exam.id) }}">

    <input type="hidden"
           id="questionId"
           value="{{ question.id }}">
    <input type="hidden"
           name="answer"
           id="selectedAnswer"
           value="{{ saved_answer.selected_answer if saved_answer else '' }}">

    <button type="button"
            class="btn btn-outline-primary option-btn"
            data-answer="A"
            onclick="selectAnswer('A', this)">
        A. {{ question.choice_a }}
    </button>

    <button type="button"
            class="btn btn-outline-primary option-btn"
            data-answer="B"
            onclick="selectAnswer('B', this)">
        B. {{ question.choice_b }}
    </button>

    <button type="button"
            class="btn btn-outline-primary option-btn"
            data-answer="C"
            onclick="selectAnswer('C', this)">
        C. {{ question.choice_c }}
    </button>

    <button type="button"
            class="btn btn-outline-primary option-btn"
            data-answer="D"
            onclick="selectAnswer('D', this)">
        D. {{ question.choice_d }}
    </button>

</form>

        </div>

    </div>

</div>

<div class="d-flex justify-content-between mt-4">

    {% if prev_question %}
    <button
        class="btn btn-secondary"
        onclick="navigateQuestion('{{ url_for('take_exam',
            exam_id=exam.id,
            question_id=prev_question.id) }}')">

        ⬅ Previous

    </button>
    {% else %}
    <div></div>
    {% endif %}

    {% if next_question %}
    <button
        class="btn btn-primary"
        onclick="navigateQuestion('{{ url_for('take_exam',
            exam_id=exam.id,
            question_id=next_question.id) }}')">

        Next ➡

    </button>
    {% else %}
    <button class="btn btn-success" onclick="submitExam()">
        Finish Exam
    </button>
    {% endif %}

</div>

<div class="fixed-bottom bg-light p-2 border-top">

  <div class="container">

    <div class="d-flex justify-content-between mb-1">
      <small>Progress</small>
      <small>{{ current_index }} / {{ total }}</small>
    </div>

    <div class="progress">
      <div class="progress-bar"
           role="progressbar"
           style="width: {{ progress }}%">
        {{ progress }}%
      </div>
    </div>

  </div>

</div>

<!-- ========================================================= -->
<!-- 📝 EXAM CONTROLLER -->
<!-- Handles all client-side exam functions:
     • Countdown Timer
     • Answer Selection
     • Automatic Answer Saving
     • Restore Previous Answers
     • Exam Submission

     Future Features:
     • Question Transition Animation
     • Question Navigator
     • Review Answers Modal
     • Keyboard Shortcuts
     • Anti-Cheat Protection
-->
<!-- ========================================================= -->
<script>

// =========================================================
// ⏱️ EXAM COUNTDOWN TIMER
// =========================================================

let timeLeft = {{ remaining_seconds }};
let timerInterval = null;

function updateTimer() {

    if (timeLeft <= 0) {

        document.getElementById("timer").innerText = "00:00";

        clearInterval(timerInterval);

        submitExam(true);

        return;

    }

    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;

    document.getElementById("timer").innerText =
        `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;

    timeLeft--;

}

updateTimer();

timerInterval = setInterval(updateTimer, 1000);


// =========================================================
// 💾 SAVE ANSWER TO DATABASE
// Called automatically whenever a student selects an answer.
// =========================================================

async function saveAnswer(answer) {

    try {

        const response = await fetch("/save-answer", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                question_id:
                    document.getElementById("questionId").value,

                answer: answer

            })

        });

        if (!response.ok) {

            console.error("Unable to save answer.");

        }

        document.getElementById("saveStatus").style.display = "block";

        setTimeout(() => {

            document.getElementById("saveStatus").style.display = "none";

        }, 1200);

    }
    catch (error) {

        console.error(error);

    }

}


// =========================================================
// ✅ ANSWER SELECTION
// Highlights the student's selected answer and immediately
// saves it into the database.
// =========================================================

async function selectAnswer(answer, button) {

    // Store selected answer locally
    document.getElementById("selectedAnswer").value = answer;

    // Remove previous highlight
    document.querySelectorAll(".option-btn").forEach(btn => {

        btn.classList.remove("btn-primary");

        btn.classList.add("btn-outline-primary");

    });

    // Highlight current answer
    button.classList.remove("btn-outline-primary");

    button.classList.add("btn-primary");

    // Save answer automatically
    await saveAnswer(answer);

}


// =========================================================
// 🔄 RESTORE PREVIOUSLY SAVED ANSWER
// Executes every time a question page is opened.
// =========================================================

window.onload = function () {

    const savedAnswer =
        document.getElementById("selectedAnswer").value;

    if (!savedAnswer) return;

    document.querySelectorAll(".option-btn").forEach(btn => {

        if (btn.dataset.answer === savedAnswer) {

            btn.classList.remove("btn-outline-primary");

            btn.classList.add("btn-primary");

        }

    });

};

// =========================================================
// 🚀 SMOOTH QUESTION NAVIGATION
// Adds a short slide/fade animation before
// moving to another question.
// =========================================================

function navigateQuestion(url){

    const card =
        document.getElementById("questionCard");

    card.classList.add("fade-out");

    setTimeout(function(){

        window.location.href = url;

    },250);

}

// =========================================================
// 📤 SUBMIT EXAM
// Manual submission asks confirmation.
// Automatic submission skips confirmation.
// =========================================================

function submitExam(autoSubmit = false) {

    if (!autoSubmit) {

        if (!confirm("Are you sure you want to submit your exam?")) {

            return;

        }

    }

    window.location.href =
        "{{ url_for('submit_exam', exam_id=exam.id) }}";

}


// =========================================================
// 🚧 UPCOMING FEATURES
// (Reserved for Exam System Version 2)
// =========================================================
//
// 1. Smooth Question Transition
//
// 2. Question Navigator
//
// 3. Review Answers Modal
//
// 4. Keyboard Shortcuts
//
// 5. Auto Save Before Navigation
//
// 6. Anti-Cheat Enhancements
//
// =========================================================

</script>

</body>
</html>
