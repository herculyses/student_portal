<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Exam</title>

<link rel="icon" type="image/png"
      href="{{ url_for('static', filename='favicon.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .option-btn {
            width: 100%;
            text-align: left;
            margin-bottom: 10px;
        }
    </style>
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- Timer -->
    <div class="alert alert-info text-center">
        Time Left:
        <span id="timer"></span>

        <input
            type="hidden"
            id="remainingSeconds"
            value="{{ remaining_seconds }}"
        >
    </div>

    <!-- Question -->
    <div class="card shadow-sm">

        <div class="card-body">

            <h5>
                {{ question.question_text }}
            </h5>

<form method="POST" action="{{ url_for('submit_answer', exam_id=exam.id) }}">

    <input type="hidden" name="question_id" value="{{ question.id }}">
    <input type="hidden" name="answer" id="selectedAnswer">

    <button type="button" onclick="selectAnswer('A')" class="btn btn-outline-primary option-btn">
        A. {{ question.choice_a }}
    </button>

    <button type="button" onclick="selectAnswer('B')" class="btn btn-outline-primary option-btn">
        B. {{ question.choice_b }}
    </button>

    <button type="button" onclick="selectAnswer('C')" class="btn btn-outline-primary option-btn">
        C. {{ question.choice_c }}
    </button>

    <button type="button" onclick="selectAnswer('D')" class="btn btn-outline-primary option-btn">
        D. {{ question.choice_d }}
    </button>

    <button type="submit" class="btn btn-success w-100 mt-3">
        Submit Answer
    </button>

</form>

        </div>

    </div>

</div>

<div class="d-flex justify-content-between mt-4">

    {% if prev_question %}
    <a href="{{ url_for('take_exam', exam_id=exam.id, question_id=prev_question.id) }}"
       class="btn btn-secondary">
        ⬅ Previous
    </a>
    {% else %}
    <div></div>
    {% endif %}

    {% if next_question %}
    <a href="{{ url_for('take_exam', exam_id=exam.id, question_id=next_question.id) }}"
       class="btn btn-primary">
        Next ➡
    </a>
    {% else %}
    <button class="btn btn-success" onclick="submitExam()">
        Finish Exam
    </button>
    {% endif %}

</div>

<div class="fixed-bottom bg-light p-2 border-top">

  <div class="container">

    <div class="d-flex justify-content-between mb-1">
      <small>Progress</small>
      <small>{{ current_index }} / {{ total }}</small>
    </div>

    <div class="progress">
      <div class="progress-bar"
           role="progressbar"
           style="width: {{ progress }}%">
        {{ progress }}%
      </div>
    </div>

  </div>

</div>

<!-- ========================================================= -->
<!-- ⏱️ EXAM COUNTDOWN TIMER -->
<!-- Controls the student's remaining exam time. -->
<!-- Automatically submits the exam when the timer reaches zero. -->
<!-- ========================================================= -->
<script>
let timeLeft = {{ remaining_seconds }};
let timerInterval = null;

function updateTimer() {

    if (timeLeft <= 0) {
        document.getElementById("timer").innerText = "00:00";

        clearInterval(timerInterval);

        submitExam(true);
        return;
    }

    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;

    document.getElementById("timer").innerText =
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

    timeLeft--;
}

updateTimer();

timerInterval = setInterval(updateTimer, 1000);
</script>

<!-- ========================================================= -->
<!-- ✅ ANSWER SELECTION -->
<!-- Stores the student's selected answer before submission. -->
<!-- (Autosave will be added here later.) -->
<!-- ========================================================= -->
<script>
function selectAnswer(value) {
    document.getElementById("selectedAnswer").value = value;
}
</script>

<!-- ========================================================= -->
<!-- 📤 EXAM SUBMISSION -->
<!-- Manual submission asks for confirmation. -->
<!-- Automatic submission (timer expires) skips confirmation. -->
<!-- ========================================================= -->
<script>
function submitExam(autoSubmit = false) {

    if (!autoSubmit) {
        if (!confirm("Are you sure you want to submit your exam?")) {
            return;
        }
    }

    window.location.href =
        "{{ url_for('submit_exam', exam_id=exam.id) }}";
}
</script>

</body>
</html>
